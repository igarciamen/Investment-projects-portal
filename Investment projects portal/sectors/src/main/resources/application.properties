spring.application.name=sectors
server.port=8082

# PostgreSQL database (same Postgres instance as "users"/"projects", different database)
spring.datasource.url=jdbc:postgresql://localhost:5432/sectorsInvestEU
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:apertura15}

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public

# SAME secret as users/projects: this way sectors can validate the tokens
# that users issued at login, without calling users for it.
jwt.secret=${JWT_SECRET:0123456789ABCDEFGHIJKLMNOPQRSTUV}

app.cors.allowed-origins=http://localhost:4200
