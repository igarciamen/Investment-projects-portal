spring.datasource.url=jdbc:h2:mem:documentsdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

jwt.secret=test-secret-just-for-tests-0123456789

projects.base-url=http://localhost:8083/api/projects
users.base-url=http://localhost:8081/api/user
notifications.base-url=http://localhost:8085/api/notifications
app.admin.notification-email=isabel@admin.local

documents.storage-path=./build/test-uploads

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

app.cors.allowed-origins=http://localhost:4200