spring.application.name=documents
server.port=8084

spring.datasource.url=jdbc:postgresql://localhost:5432/documentsInvestEU
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:apertura15}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public

jwt.secret=${JWT_SECRET:0123456789ABCDEFGHIJKLMNOPQRSTUV}

projects.base-url=http://localhost:8083/api/projects

# Base URL of "users" (see UserClient) and "notifications" (see EmailClient).
users.base-url=http://localhost:8081/api/user
notifications.base-url=http://localhost:8085/api/notifications

# Where the "new document uploaded by the promoter" email goes -- same
# reasoning as in projects (Block 4): a fixed inbox instead of looking up
# "who are the admins", since there is no such listing endpoint.
app.admin.notification-email=isabel@admin.local

documents.storage-path=./investeu-uploads

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
server.tomcat.max-swallow-size=-1

app.cors.allowed-origins=http://localhost:4200