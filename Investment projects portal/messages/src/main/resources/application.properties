spring.application.name=messages
server.port=8087

spring.datasource.url=jdbc:postgresql://localhost:5432/messagesInvestEU
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:apertura15}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public

jwt.secret=${JWT_SECRET:0123456789ABCDEFGHIJKLMNOPQRSTUV}

# Base URL of the "projects" microservice (RestTemplate, see ProjectClient).
projects.base-url=http://localhost:8083/api/projects

# Base URL of "users" (see UserClient) and "notifications" (see EmailClient),
# needed to notify the other party whenever a new message is sent.
users.base-url=http://localhost:8081/api/user
notifications.base-url=http://localhost:8085/api/notifications

app.cors.allowed-origins=http://localhost:4200
