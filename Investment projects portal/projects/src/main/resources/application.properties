spring.application.name=projects
server.port=8083

# PostgreSQL database (same Postgres instance as "users", different database)
spring.datasource.url=jdbc:postgresql://localhost:5432/projectsInvestEU
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:apertura15}

# Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public

# SAME secret as the users microservice: this way projects can validate the
# tokens that users issued at login, without calling users for it.
jwt.secret=${JWT_SECRET:0123456789ABCDEFGHIJKLMNOPQRSTUV}

# Base URL of the "sectors" microservice (RestTemplate, see SectorClient).
sectors.base-url=http://localhost:8082/api/sectors

# Base URL of the "users" microservice (RestTemplate, see UserClient). Uses
# /api/user (no trailing slash) because UserClient appends "/" + id.
users.base-url=http://localhost:8081/api/user

# Base URL of the "notifications" microservice (RestTemplate, see EmailClient).
notifications.base-url=http://localhost:8085/api/notifications

# Where the "new project submitted" email goes. A fixed inbox instead of
# looking up "who are the admins" in users, since there is no such listing
# endpoint yet and, in practice, this is a shared inbox anyway.
app.admin.notification-email=isabel@admin.local

app.cors.allowed-origins=http://localhost:4200
