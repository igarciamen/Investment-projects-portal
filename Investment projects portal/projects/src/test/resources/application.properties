spring.datasource.url=jdbc:h2:mem:projectsdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

jwt.secret=test-secret-just-for-tests-0123456789

# Not actually called in tests -- SectorClient is mocked with @MockitoBean in
# ProjectControllerIT/ProjectServiceTest -- but the property must exist for
# the Spring context to start, since SectorClient's constructor requires it.
sectors.base-url=http://localhost:8082/api/sectors

app.cors.allowed-origins=http://localhost:4200


# Not actually called in tests -- SectorClient/UserClient/EmailClient are
# mocked with @MockitoBean in ProjectControllerIT/ProjectServiceTest -- but
# the properties must exist for the Spring context to start, since each
# client's constructor requires them.

users.base-url=http://localhost:8081/api/user
notifications.base-url=http://localhost:8085/api/notifications
app.admin.notification-email=isabel@admin.local

