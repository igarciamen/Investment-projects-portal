spring.datasource.url=jdbc:h2:mem:interestsdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

jwt.secret=test-secret-just-for-tests-0123456789

# Not actually called in tests -- ProjectClient is mocked with @MockitoBean.
projects.base-url=http://localhost:8083/api/projects

app.cors.allowed-origins=http://localhost:4200
