spring.application.name=interests
server.port=8086

spring.datasource.url=jdbc:postgresql://localhost:5432/interestsInvestEU
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD:apertura15}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=public

jwt.secret=${JWT_SECRET:0123456789ABCDEFGHIJKLMNOPQRSTUV}

# Base URL of the "projects" microservice (RestTemplate, see ProjectClient).
# Used to check that a project exists and is APPROVED before accepting
# interest in it.
projects.base-url=http://localhost:8083/api/projects

app.cors.allowed-origins=http://localhost:4200
