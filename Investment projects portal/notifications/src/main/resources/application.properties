spring.application.name=notifications
server.port=8085

# SMTP (Gmail). For a real Gmail account this must be an "app password", not
# the regular account password -- 2FA has to be enabled first to generate one.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:your-test-account@gmail.com}
spring.mail.password=${GMAIL_APP_PASSWORD:replace-with-a-gmail-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# SAME secret as the rest of the microservices: this way notifications
# validates the token forwarded by whichever service calls it (currently
# only "projects"), without calling "users" for it.
jwt.secret=${JWT_SECRET:0123456789ABCDEFGHIJKLMNOPQRSTUV}

app.cors.allowed-origins=http://localhost:4200